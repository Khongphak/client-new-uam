<div class="phead">
  <div class="phead-in">
    <h1>Report</h1>
    <div class="tabs" role="tablist" aria-label="Report type">
      @for (t of types; track t.id) {
        <button
          type="button"
          role="tab"
          class="tab"
          [class.is-active]="type() === t.id"
          [attr.aria-selected]="type() === t.id"
          [attr.data-testid]="'tab-' + t.id"
          (click)="selectType(t.id)"
        >
          {{ t.name }}
        </button>
      }
    </div>
  </div>
</div>

<div class="content">
  <section class="card" aria-label="Report options">
    <h2 class="card__title">{{ current().name }}</h2>
    <p class="hint">{{ current().description }}</p>

    <div class="form-grid">
      <div class="field">
        <label for="rpt-system">System Name <span class="req">*</span></label>
        <select
          id="rpt-system"
          class="p-inputtext p-component"
          data-testid="system-select"
          [value]="systemId()"
          (change)="selectSystem($any($event.target).value)"
        >
          <option value="">Select a system</option>
          @for (s of systemList(); track s.systemId) {
            <option [value]="s.systemId" [selected]="s.systemId === systemId()">
              {{ s.systemName.trim() }}
            </option>
          }
        </select>
      </div>

      @if (type() === 'matrix') {
        <div class="field">
          <label for="rpt-dep">Department</label>
          <select
            id="rpt-dep"
            class="p-inputtext p-component"
            data-testid="department-select"
            [value]="department()"
            (change)="department.set($any($event.target).value)"
          >
            <option value="">All departments</option>
            @for (d of departments(); track d) {
              <option [value]="d" [selected]="d === department()">{{ d }}</option>
            }
          </select>
        </div>
      } @else {
        <div class="field">
          <label for="rpt-range">Date range</label>
          <select
            id="rpt-range"
            class="p-inputtext p-component"
            data-testid="range-select"
            [value]="range()"
            (change)="selectRange($any($event.target).value)"
          >
            @for (r of rangeChoices; track r) {
              <option [value]="r" [selected]="r === range()">{{ r }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="rpt-from">From <span class="req">*</span></label>
          <input
            id="rpt-from"
            type="date"
            class="p-inputtext p-component"
            data-testid="date-from"
            [value]="from()"
            (input)="editDate('from', $any($event.target).value)"
          />
        </div>
        <div class="field">
          <label for="rpt-to">To <span class="req">*</span></label>
          <input
            id="rpt-to"
            type="date"
            class="p-inputtext p-component"
            data-testid="date-to"
            [value]="to()"
            (input)="editDate('to', $any($event.target).value)"
          />
        </div>
      }
    </div>

    <div class="exportbar">
      <button
        type="button"
        class="p-button p-component p-button-text"
        data-testid="reset-btn"
        (click)="reset()"
      >
        <i class="pi pi-refresh" aria-hidden="true"></i>
        <span class="p-button-label">Reset</span>
      </button>
      <button
        type="button"
        class="p-button p-component"
        data-testid="export-btn"
        [disabled]="!canExport() || exporting()"
        (click)="exportReport()"
      >
        <i
          class="pi"
          [class.pi-download]="!exporting()"
          [class.pi-spin]="exporting()"
          [class.pi-spinner]="exporting()"
          aria-hidden="true"
        ></i>
        <span class="p-button-label">Export</span>
      </button>
    </div>
  </section>
</div>
